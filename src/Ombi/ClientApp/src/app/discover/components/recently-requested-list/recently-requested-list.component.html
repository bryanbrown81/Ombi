@if (!loaded() || requests().length > 0) {
    <header class="au-section-head">
        <h2 class="au-section-title" [id]="(id || 'recentlyRequested') + '-title'">{{ title() }}</h2>
        @if (requests().length > 0) {
            <span class="au-section-count">{{ requests().length }}</span>
        }
    </header>

    @if (loaded()) {
        <ombi-media-rail class="recently-rail" [label]="title()">
            @for (result of requests(); track result; let i = $index) {
                <div class="ombi-rail__item" role="listitem" [style.--i]="i % 14">
                    <ombi-detailed-card
                        [request]="result"
                        [isAdmin]="isAdmin"
                        (onClick)="navigate(result)"
                        (onApprove)="approve(result)"
                        (onDeny)="deny(result)">
                    </ombi-detailed-card>
                </div>
            }
        </ombi-media-rail>
    } @else {
        <div class="au-skeleton-row" aria-hidden="true">
            @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track item) {
                <div class="recently-skeleton">
                    <div class="au-skeleton au-skeleton-poster"></div>
                    <div class="au-skeleton recently-skeleton-line"></div>
                    <div class="au-skeleton recently-skeleton-line short"></div>
                </div>
            }
        </div>
    }
}
