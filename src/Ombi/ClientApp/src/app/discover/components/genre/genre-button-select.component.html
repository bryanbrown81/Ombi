<header class="dx-section-head">
    @if (index()) {
        <span class="dx-section-index">{{ index() }}</span>
    }
    <h2 class="dx-section-title" id="discover-genres-title">{{ 'Discovery.BrowseGenres' | translate }}</h2>
    <span class="dx-section-rule" aria-hidden="true"></span>
    <div class="dx-section-actions">
        <div class="dx-seg" role="group" aria-labelledby="discover-genres-title"
            [style.--seg-count]="2" [style.--seg-index]="mediaType() === 'movie' ? 0 : 1">
            <span class="dx-seg__indicator" aria-hidden="true"></span>
            <span class="dx-seg__cell" [class.filter-active]="mediaType() === 'movie'">
                <button type="button" class="dx-seg__btn" id="genreMovies-button" [attr.aria-pressed]="mediaType() === 'movie'"
                    (click)="setMediaType('movie')">{{ 'Discovery.Movies' | translate }}</button>
            </span>
            <span class="dx-seg__cell" [class.filter-active]="mediaType() === 'tv'">
                <button type="button" class="dx-seg__btn" id="genreTv-button" [attr.aria-pressed]="mediaType() === 'tv'"
                    (click)="setMediaType('tv')">{{ 'Discovery.Tv' | translate }}</button>
            </span>
        </div>
    </div>
</header>

@if (genres(); as list) {
    <div class="genre-list" [class.is-busy]="!!pending()" [attr.aria-busy]="!!pending()">
        @for (genre of list; track genre.type + '-' + genre.id; let i = $index) {
            <button type="button" class="genre-chip" [class.is-pending]="isPending(genre)"
                [style.--hue]="hueFor(genre)" [style.--i]="i"
                (click)="selectGenre(genre)">
                <span class="genre-icon" aria-hidden="true">
                    @if (isPending(genre)) {
                        <span class="genre-spinner"></span>
                    } @else {
                        <i [class]="iconFor(genre)"></i>
                    }
                </span>
                <span class="genre-name">{{ genre.name }}</span>
            </button>
        }
    </div>
} @else {
    <div class="genre-list genre-list--loading" aria-hidden="true">
        @for (item of [92, 120, 86, 104, 132, 96, 110, 88, 124, 100]; track $index) {
            <span class="dx-skeleton genre-skeleton" [style.width.px]="item"></span>
        }
    </div>
}
